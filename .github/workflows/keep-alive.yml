# Render's free tier spins this service down after ~15 minutes of no
# traffic, and the first request after that has to wait for a cold start
# (see src/routes/planTrip.js and journey-app's aiRequest.ts, which retries
# once through exactly that window). Pinging /health well inside that
# window keeps the instance awake so users hit a warm server far more
# often — free (GitHub Actions' scheduled-workflow minutes), no Render
# billing involved.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        # A failed ping just means the free instance was already asleep or
        # briefly waking — not worth failing the workflow (and spamming
        # failure notifications) over.
        run: curl -sf --max-time 20 https://jourrrney-backend.onrender.com/health || echo "Ping did not succeed — service may have been cold."
