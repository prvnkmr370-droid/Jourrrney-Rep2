services:
  - type: web
    name: jourrrney-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Render generates a real random value for this on first deploy —
      # replaces the insecure "dev-only-secret-change-me" fallback in code.
      - key: JWT_SECRET
        generateValue: true
      # "production" so a missing or broken email provider fails closed: with no
      # RESEND_API_KEY / BREVO_API_KEY (plus EMAIL_FROM) set, /auth/request-code
      # answers 503 and email sign-in is simply off. It used to be "development",
      # which made the server show every sign-in code to whoever asked, i.e.
      # anyone could sign in as any email address. (routes/auth.js also refuses to
      # show codes on Render whatever this says.)
      - key: NODE_ENV
        value: production
      # Email delivery for the sign-in code (src/lib/mailer.js). Set ONE of
      # the two API keys, plus EMAIL_FROM, in the Render dashboard
      # (Environment tab). Render's free tier blocks SMTP, so these are
      # HTTPS email APIs. EMAIL_FROM must be an address the provider has
      # verified, e.g.  Jourrrney <login@yourdomain.com>
      - key: RESEND_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # `sync: false` means Render won't try to auto-generate or require a
      # value at deploy time — it just leaves a blank slot to fill in
      # manually from the Render dashboard (Environment tab). Get a free
      # key at https://ai.google.dev. Powers POST /plan-trip/ai; the app
      # falls back to its local planner if this is left unset.
      - key: GEMINI_API_KEY
        sync: false
      # Sign in with Facebook (src/routes/facebookAuth.js). Fill in from the
      # Meta for Developers dashboard; leave blank and the Facebook button in
      # the app just says it isn't available yet. The secret stays here only.
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      # Sign in with Google (src/routes/googleAuth.js). Fill in from the Google
      # Cloud console (OAuth client of type "Web application"); leave blank and
      # the Google button just says it isn't available yet. Secret stays here only.
      - key: GOOGLE_WEB_CLIENT_ID
        sync: false
      - key: GOOGLE_WEB_CLIENT_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://jourrrney-backend.onrender.com
      - key: SUPPORT_EMAIL
        sync: false
